<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>加權指數 202509F3｜選擇權指標圖表</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116;
    --panel: #171b22;
    --ink: #e6e9ef;
    --muted: #8b93a3;
    --line: #2a2f3a;
    --call: #e5484d;     /* 買權：紅 */
    --put:  #4f8cff;     /* 賣權：藍 */
    --accent: #ffb454;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Microsoft JhengHei",
                 "Helvetica Neue", Arial, sans-serif;
    padding: 28px clamp(16px, 4vw, 56px);
  }
  header { margin-bottom: 22px; }
  h1 {
    font-size: clamp(20px, 2.4vw, 28px); margin: 0 0 6px;
    letter-spacing: .5px; font-weight: 700;
  }
  .sub { color: var(--muted); font-size: 14px; }
  .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px 18px; margin: 18px 0 26px;
  }
  .controls label { font-size: 14px; color: var(--muted); }
  select {
    background: #11151c; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px; font-size: 15px; min-width: 280px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 18px 8px; margin-bottom: 22px;
  }
  .card h2 {
    font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
  .dot.call { background: var(--call); }
  .dot.put  { background: var(--put); }
  .chart-wrap { position: relative; height: 340px; }
  footer { color: var(--muted); font-size: 12px; margin-top: 10px; }
</style>
</head>
<body>
  <header>
    <h1>加權指數 202509F3 ｜ 選擇權指標時間序列</h1>
    <div class="sub">買權（C）與賣權（P）分開呈現，可切換不同指標檢視</div>
  </header>

  <div class="controls">
    <label for="metric">指標：</label>
    <select id="metric"></select>
  </div>

  <div class="card">
    <h2><span class="dot call"></span>買權 Call（C）</h2>
    <div class="chart-wrap"><canvas id="chartC"></canvas></div>
  </div>

  <div class="card">
    <h2><span class="dot put"></span>賣權 Put（P）</h2>
    <div class="chart-wrap"><canvas id="chartP"></canvas></div>
  </div>

.616809019312]};
const METRICS = {"mjd_sigma": "MJD σ（擴散波動率 sigma）", "mjd_lambda": "MJD λ（跳躍強度 lambda）", "mjd_gamma": "MJD γ（平均跳躍幅度 gamma）", "mjd_delta": "MJD δ（跳躍波動率 delta）", "rnd_mean": "RND 平均數（mean）", "rnd_variance": "RND 變異數（variance）", "rnd_skewness": "RND 偏態（skewness）", "rnd_kurtosis": "RND 峰態（kurtosis）"};   // {key: 顯示名稱}

const sel = document.getElementById('metric');
Object.entries(METRICS).forEach(([k, name]) => {
  const o = document.createElement('option');
  o.value = k; o.textContent = name;
  sel.appendChild(o);
});

const baseOpts = (color) => ({
  responsive: true,
  maintainAspectRatio: false,
  interaction: { mode: 'index', intersect: false },
  plugins: {
    legend: { display: false },
    tooltip: {
      backgroundColor: '#11151c', borderColor: '#2a2f3a', borderWidth: 1,
      titleColor: '#e6e9ef', bodyColor: '#e6e9ef',
    }
  },
  scales: {
    x: { ticks: { color: '#8b93a3', maxRotation: 60, minRotation: 60 },
         grid: { color: 'rgba(255,255,255,.05)' } },
    y: { ticks: { color: '#8b93a3' },
         grid: { color: 'rgba(255,255,255,.06)' } }
  },
  elements: { point: { radius: 3, hoverRadius: 5 }, line: { tension: .25 } }
});

function makeChart(canvasId, color) {
  return new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: { labels: LABELS, datasets: [{
      data: [], borderColor: color, backgroundColor: color,
      spanGaps: false, borderWidth: 2, fill: false
    }]},
    options: baseOpts(color)
  });
}

const chartC = makeChart('chartC', getComputedStyle(document.documentElement).getPropertyValue('--call').trim());
const chartP = makeChart('chartP', getComputedStyle(document.documentElement).getPropertyValue('--put').trim());

function update() {
  const m = sel.value;
  chartC.data.datasets[0].data = DATA_C[m];
  chartC.data.datasets[0].label = METRICS[m] + '（C）';
  chartP.data.datasets[0].data = DATA_P[m];
  chartP.data.datasets[0].label = METRICS[m] + '（P）';
  chartC.update();
  chartP.update();
}

sel.addEventListener('change', update);
update();
</script>
</body>
</html>
