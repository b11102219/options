<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網站地圖</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px;
    }

    h1 {
      color: #333;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: white;
      margin-bottom: 10px;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    a {
      text-decoration: none;
      color: #0077cc;
      font-size: 18px;
    }

    a:hover {
      color: #005599;
    }
  </style>
</head>
<body>

  <h1>網站頁面列表</h1>

  <ul id="linkList">
    <li>載入中...</li>
  </ul>

  <script>
    const sitemapUrl = "https://b11102219.github.io/options/sitemap.xml";

    fetch(sitemapUrl)
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const urls = data.getElementsByTagName("loc");
        const list = document.getElementById("linkList");

        list.innerHTML = "";

        for (let i = 0; i < urls.length; i++) {
          const url = urls[i].textContent;

          const li = document.createElement("li");
          const a = document.createElement("a");

          a.href = url;
          a.textContent = url;
          a.target = "_blank";

          li.appendChild(a);
          list.appendChild(li);
        }
      })
      .catch(error => {
        document.getElementById("linkList").innerHTML =
          "<li>無法載入 sitemap.xml</li>";

        console.error(error);
      });
  </script>

</body>
</html>
